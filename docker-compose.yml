version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=test123
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:8080/api/
      - N8N_PROTOCOL=http
    volumes:
      # Lokales n8n-Verzeichnis mounten (DEIN Benutzername hier!)
      - "C:\\Users\\stani\\.n8n:/home/node/.n8n"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - n8n
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
